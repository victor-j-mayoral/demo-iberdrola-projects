services:
  webapp:
    build: ./webapp
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5433/demo_iberdrola
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: cncfjy
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: demo_iberdrola
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cncfjy
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo_iberdrola"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos-postgres: